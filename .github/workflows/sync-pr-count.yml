name: sync-pr-count

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: recount and rewrite
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node .github/scripts/sync-pr-count.mjs

      - name: commit if the figure moved
        run: |
          if git diff --quiet -- README.md; then
            echo "no change"
            exit 0
          fi
          git config user.name "mahirhir"
          git config user.email "246701683+mahirhir@users.noreply.github.com"
          git add README.md
          git commit -m "chore(readme): resync the merged-PR figure"
          git push
